name: Inspect Eden NX2 Android Source

on:
  push:
    branches:
      - eden-android-port
    paths:
      - '.github/workflows/inspect-eden-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orchid port branch
        uses: actions/checkout@v4

      - name: Clone Eden NX2 Android
        run: |
          git clone --depth 1 --branch nx2-android https://git.eden-emu.dev/moceure/eden-nx2-android.git eden-nx2-android
          echo "Eden source cloned successfully."
          git -C eden-nx2-android log -1 --oneline

      - name: Inspect Android build configuration
        run: |
          cd eden-nx2-android
          echo "===== Android environment script ====="
          sed -n '1,240p' tools/nx2/android/env.sh
          echo "===== Android CI build script ====="
          sed -n '1,280p' .ci/android/build.sh
          echo "===== Android root Gradle file ====="
          sed -n '1,220p' src/android/build.gradle.kts
          echo "===== Android app Gradle file ====="
          sed -n '1,260p' src/android/app/build.gradle.kts
          echo "===== Android settings ====="
          sed -n '1,180p' src/android/settings.gradle.kts
          echo "===== Submodule status ====="
          git submodule status
          echo "===== APK and package configuration references ====="
          grep -R -n -E 'applicationId|namespace|versionName|versionCode|app-mainline|ANDROID_ABI|CMAKE_ANDROID' src/android tools/nx2/android .ci/android 2>/dev/null | head -160
